<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style/normalize.css" />
    <link rel="stylesheet" href="style/style.css" />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main>
      <section class="card">
        <img
          src="images/image-equilibrium.jpg"
          alt="This is an image of an prismatic cube nft"
        />
        <div class="card-minusImage">
          <div class="description-price">
            <h1 class="textPreset1">Equilibrium #3429</h1>
            <p class="textPreset2">
              Our Equilibrium collection promotes balance and calm.
            </p>
            <div class="cost-time">
              <span class="cost textPreset3-semiBold">0.041 ETH</span
              ><span class="time textPreset3-regular"> 3 days left</span>
            </div>
          </div>
          <div class="attribution">
            <img
              src="/images/image-avatar.png"
              class="avatar"
              alt="this is a small round picture or the author with a light blue boundary"
            /><span class="author">Creation of</span>
            <strong>Jules Wyvern</strong>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
